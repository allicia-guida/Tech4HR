name: Mobile

# Confere o app (tipos, lint e testes) quando algo da pasta mobile muda, em
# push na main, na dev e nas branches feature/, e em Pull Requests para elas.

on:
  push:
    branches: [main, dev, "feature/**"]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    branches: [main, dev, "feature/**"]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Tipos, lint e testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Instalar as dependências
        run: npm ci

      - name: Conferir os tipos
        run: npm run typecheck

      - name: Rodar o lint
        run: npm run lint

      - name: Rodar os testes
        run: npm test
